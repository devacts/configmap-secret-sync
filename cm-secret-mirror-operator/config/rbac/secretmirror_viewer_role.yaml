# This rule is not used by the project cm-secret-mirror-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to secretmirror.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cm-secret-mirror-operator
    app.kubernetes.io/managed-by: kustomize
  name: secretmirror-viewer-role
rules:
- apiGroups:
  - secretmirror.example.com
  resources:
  - secretmirrors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - secretmirror.example.com
  resources:
  - secretmirrors/status
  verbs:
  - get
