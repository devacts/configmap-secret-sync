# This rule is not used by the project cm-secret-mirror-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over secretmirror.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cm-secret-mirror-operator
    app.kubernetes.io/managed-by: kustomize
  name: secretmirror-admin-role
rules:
- apiGroups:
  - secretmirror.example.com
  resources:
  - secretmirrors
  verbs:
  - '*'
- apiGroups:
  - secretmirror.example.com
  resources:
  - secretmirrors/status
  verbs:
  - get
